# run with: promtool test rules observability/prometheus/tests/govwatch.rules.test.yml
# note: promtool time starts at 1970-01-01 00:00 UTC, which was a Thursday

rule_files:
  - ../rules/govwatch.rules.yml

evaluation_interval: 30s

tests:
  - name: worker down pages after 2 minutes
    interval: 1m
    input_series:
      - series: 'up{job="govwatch", instance="worker:9100"}'
        values: "1 0 0 0 0"
    alert_rule_test:
      - eval_time: 2m
        alertname: GovwatchWorkerDown
        exp_alerts: []
      - eval_time: 4m
        alertname: GovwatchWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: govwatch
              instance: worker:9100
            exp_annotations:
              summary: govwatch worker is not being scraped
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchworkerdown

  - name: lag keeps growing after the worker disappears
    interval: 1m
    input_series:
      # last success at t=0, then the target vanishes after 10 minutes
      - series: 'govwatch_ingest_last_success_timestamp_seconds{source="congress"}'
        values: "0x10"
    promql_expr_test:
      - expr: govwatch:ingest_lag_seconds
        eval_time: 1h
        exp_samples:
          - labels: 'govwatch:ingest_lag_seconds{source="congress"}'
            value: 3600

  - name: three failures in an hour
    interval: 5m
    input_series:
      - series: 'govwatch_ingest_runs_total{source="regulations", status="failed"}'
        values: "0 1 2 3 3 3"
    alert_rule_test:
      - eval_time: 10m
        alertname: GovwatchIngestFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: GovwatchIngestFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              source: regulations
              status: failed
            exp_annotations:
              summary: regulations had 3+ failed ingest runs in the last hour
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchingestfailing

  - name: fast burn fires when the pipeline stops keeping up
    interval: 1m
    input_series:
      # healthy for an hour (last success keeps moving), then stuck at t=60m
      - series: 'govwatch_ingest_last_success_timestamp_seconds{source="regulations"}'
        values: "0+60x60 3600x120"
    alert_rule_test:
      - eval_time: 60m
        alertname: GovwatchLagBudgetBurnFast
        exp_alerts: []
      # lag crosses 30m at ~90m; needs >14.4% of the last hour (~9 min) bad
      - eval_time: 105m
        alertname: GovwatchLagBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              source: regulations
            exp_annotations:
              summary: regulations ingest lag is burning the 30d error budget at 14x+
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchlagbudgetburn

  - name: regulations staleness only alerts in weekday business hours
    interval: 10m
    input_series:
      # newest record stuck at t=0 for three days
      - series: 'govwatch_source_newest_record_timestamp_seconds{source="regulations"}'
        values: "0x450"
    alert_rule_test:
      # thursday 03:00 utc: stale, but outside business hours
      - eval_time: 3h
        alertname: GovwatchRegulationsDataStale
        exp_alerts: []
      # thursday 16:00 utc: stale and in business hours
      - eval_time: 16h
        alertname: GovwatchRegulationsDataStale
        exp_alerts:
          - exp_labels:
              severity: warning
              source: regulations
            exp_annotations:
              summary: no new regulations.gov documents in 4h during business hours
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchdatastale
      # saturday 16:00 utc: still stale, but nobody publishes on saturday
      - eval_time: 64h
        alertname: GovwatchRegulationsDataStale
        exp_alerts: []

  - name: rate limit headroom
    interval: 1m
    input_series:
      - series: 'govwatch_api_ratelimit_remaining{source="regulations"}'
        values: "500 200 80 50 40 30 20 10 10"
      - series: 'govwatch_api_ratelimit_limit{source="regulations"}'
        values: "1000x8"
    alert_rule_test:
      # below 10% from 2m, so `for: 5m` completes at 7m - but the alert reads a series
      # recorded by another rule group, and groups evaluate independently, so it can lag
      # one 30s evaluation. asserting exactly at 7m made this test fail ~1 run in 5
      - eval_time: 8m
        alertname: GovwatchRateLimitLow
        exp_alerts:
          - exp_labels:
              severity: warning
              source: regulations
            exp_annotations:
              summary: regulations has under 10% of its api.data.gov rate limit left
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchratelimitlow

  - name: incomplete data alert names the shortfall
    interval: 1m
    input_series:
      - series: 'govwatch_completeness_ratio{source="regulations"}'
        values: "1 1 0.9806 0.9806"
      - series: 'govwatch_completeness_missing_records{source="regulations"}'
        values: "0 0 25 25"
    alert_rule_test:
      - eval_time: 1m
        alertname: GovwatchDataIncomplete
        exp_alerts: []
      - eval_time: 3m
        alertname: GovwatchDataIncomplete
        exp_alerts:
          - exp_labels:
              severity: warning
              source: regulations
            exp_annotations:
              summary: regulations is missing 25 records from its last audit window
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchdataincomplete

  - name: one repair is fine, repeated repairs alert
    interval: 1h
    input_series:
      - series: 'govwatch_completeness_repairs_total{source="congress"}'
        values: "0 1 1 1 2 2"
    alert_rule_test:
      - eval_time: 2h
        alertname: GovwatchRepeatedRepairs
        exp_alerts: []
      - eval_time: 5h
        alertname: GovwatchRepeatedRepairs
        exp_alerts:
          - exp_labels:
              severity: warning
              source: congress
            exp_annotations:
              summary: congress needed 2 auto-repairs in the last 24h
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchrepeatedrepairs

  # regression: the review app used to export the worker's metrics too, including
  # heartbeat=0, which made this alert fire for job="review" with a healthy worker
  - name: worker stalled only looks at the worker's own heartbeat
    interval: 1m
    input_series:
      - series: 'govwatch_worker_heartbeat_timestamp_seconds{job="review", instance="review:8080"}'
        values: "0x120"
      - series: 'govwatch_worker_heartbeat_timestamp_seconds{job="govwatch", instance="worker:9100"}'
        values: "0+60x120"
    alert_rule_test:
      - eval_time: 2h
        alertname: GovwatchWorkerStalled
        exp_alerts: []

  - name: llm down only after 30 minutes
    interval: 5m
    input_series:
      - series: 'govwatch_llm_up{model="qwen2.5:3b"}'
        values: "1 1 0 0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 20m
        alertname: GovwatchLLMDown
        exp_alerts: []
      - eval_time: 40m
        alertname: GovwatchLLMDown
        exp_alerts:
          - exp_labels:
              severity: warning
              model: qwen2.5:3b
            exp_annotations:
              summary: "the agent can't use qwen2.5:3b: ollama is down or the model isn't pulled"
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchllmdown

  - name: agreement drop fires with enough samples
    interval: 1m
    input_series:
      - series: 'govwatch_agent_policy_area_agreement{window="baseline"}'
        values: "0.6x120"
      - series: 'govwatch_agent_policy_area_agreement{window="recent"}'
        values: "0.4x120"
      - series: 'govwatch_agent_quality_samples{window="baseline"}'
        values: "80x120"
      - series: 'govwatch_agent_quality_samples{window="recent"}'
        values: "40x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: GovwatchAgentAgreementDrop
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: agreement with official policy areas dropped 15+ points below baseline
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchagentagreementdrop

  - name: agreement drop ignores a quiet week
    interval: 1m
    input_series:
      - series: 'govwatch_agent_policy_area_agreement{window="baseline"}'
        values: "0.6x120"
      - series: 'govwatch_agent_policy_area_agreement{window="recent"}'
        values: "0.2x120"
      - series: 'govwatch_agent_quality_samples{window="baseline"}'
        values: "80x120"
      # only 8 summaries this week: too few to call it a trend
      - series: 'govwatch_agent_quality_samples{window="recent"}'
        values: "8x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: GovwatchAgentAgreementDrop
        exp_alerts: []

  - name: output drift without input drift means the model changed
    interval: 1m
    input_series:
      - series: 'govwatch_agent_policy_area_drift{kind="output"}'
        values: "0.4x120"
      - series: 'govwatch_agent_policy_area_drift{kind="input"}'
        values: "0.05x120"
      - series: 'govwatch_agent_quality_samples{window="baseline"}'
        values: "80x120"
      - series: 'govwatch_agent_quality_samples{window="recent"}'
        values: "40x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: GovwatchAgentOutputDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: output
            exp_annotations:
              summary: the model's policy-area picks drifted while the incoming bills didn't
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchagentoutputdrift

  - name: output drift explained by the bills changing topic is not an alert
    interval: 1m
    input_series:
      - series: 'govwatch_agent_policy_area_drift{kind="output"}'
        values: "0.4x120"
      - series: 'govwatch_agent_policy_area_drift{kind="input"}'
        values: "0.35x120"
      - series: 'govwatch_agent_quality_samples{window="baseline"}'
        values: "80x120"
      - series: 'govwatch_agent_quality_samples{window="recent"}'
        values: "40x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: GovwatchAgentOutputDrift
        exp_alerts: []

  - name: gate failure rate
    interval: 1m
    input_series:
      - series: 'govwatch_agent_gate_failure_ratio{window="recent"}'
        values: "0.2x120"
      - series: 'govwatch_agent_quality_samples{window="recent"}'
        values: "50x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: GovwatchAgentGateFailuresHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              window: recent
            exp_annotations:
              summary: 20% of recent summaries failed the validation gate
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchagentgatefailureshigh

  - name: llm slow when p95 goes past 15s
    interval: 1m
    input_series:
      # every call lands in the 20s bucket: the model spilled onto the cpu
      - series: 'govwatch_llm_request_duration_seconds_bucket{model="qwen2.5:3b", le="13"}'
        values: "0x150"
      - series: 'govwatch_llm_request_duration_seconds_bucket{model="qwen2.5:3b", le="20"}'
        values: "0+1x150"
      - series: 'govwatch_llm_request_duration_seconds_bucket{model="qwen2.5:3b", le="+Inf"}'
        values: "0+1x150"
    alert_rule_test:
      - eval_time: 120m
        alertname: GovwatchLLMSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              model: qwen2.5:3b
            exp_annotations:
              summary: qwen2.5:3b p95 latency is 20s
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchllmslow

  - name: review queue goes stale after 3 days
    interval: 5m
    input_series:
      - series: 'govwatch_review_queue_oldest_timestamp_seconds{status="pending_review"}'
        values: "0x1300"
    alert_rule_test:
      - eval_time: 2d
        alertname: GovwatchReviewQueueStale
        exp_alerts: []
      - eval_time: 4d
        alertname: GovwatchReviewQueueStale
        exp_alerts:
          - exp_labels:
              severity: info
              status: pending_review
            exp_annotations:
              summary: a summary has been waiting for review for over 3 days
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchreviewqueuestale

  - name: grounding drop, like the title-only regression
    interval: 1m
    input_series:
      - series: 'govwatch_agent_source_support_median{window="baseline"}'
        values: "0.77x120"
      - series: 'govwatch_agent_source_support_median{window="recent"}'
        values: "0.2x120"
      - series: 'govwatch_agent_quality_samples{window="baseline"}'
        values: "80x120"
      - series: 'govwatch_agent_quality_samples{window="recent"}'
        values: "40x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: GovwatchAgentGroundingDrop
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: summaries are less grounded in their source text than in the baseline
              runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchagentgroundingdrop

  - name: normal wobble in grounding is not an alert
    interval: 1m
    input_series:
      - series: 'govwatch_agent_source_support_median{window="baseline"}'
        values: "0.77x120"
      - series: 'govwatch_agent_source_support_median{window="recent"}'
        values: "0.70x120"
      - series: 'govwatch_agent_quality_samples{window="baseline"}'
        values: "80x120"
      - series: 'govwatch_agent_quality_samples{window="recent"}'
        values: "40x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: GovwatchAgentGroundingDrop
        exp_alerts: []
