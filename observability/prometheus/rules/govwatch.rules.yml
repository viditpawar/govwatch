# Recording rules + alerts for govwatch. Shared by the compose stack and the k8s
# PrometheusRule, and unit tested with `promtool test rules` (see ../tests).
#
# SLO: the ingest pipeline keeps up 99% of the time over 30 days, where "keeping up"
# means the last successful run for a source finished less than 30 minutes ago.
# With the default 15 minute poll interval that tolerates one missed cycle.

groups:
  - name: govwatch.recording
    interval: 30s
    rules:
      # last_over_time keeps the series alive when the worker disappears, so lag keeps
      # climbing during an outage instead of vanishing along with the target
      - record: govwatch:ingest_lag_seconds
        expr: time() - last_over_time(govwatch_ingest_last_success_timestamp_seconds[7d])

      - record: govwatch:data_staleness_seconds
        expr: time() - last_over_time(govwatch_source_newest_record_timestamp_seconds[7d])

      - record: govwatch:ratelimit_remaining_ratio
        expr: govwatch_api_ratelimit_remaining / govwatch_api_ratelimit_limit

      - record: govwatch:api_error_ratio:1h
        expr: |
          sum by (source) (increase(govwatch_api_requests_total{code=~"5..|429|error"}[1h]))
            /
          sum by (source) (increase(govwatch_api_requests_total[1h]))

      - record: govwatch:sli_lag_good
        expr: govwatch:ingest_lag_seconds < bool 1800

  - name: govwatch.slo
    interval: 30s
    rules:
      - record: govwatch:slo_lag_error_ratio:5m
        expr: 1 - avg_over_time(govwatch:sli_lag_good[5m])
      - record: govwatch:slo_lag_error_ratio:30m
        expr: 1 - avg_over_time(govwatch:sli_lag_good[30m])
      - record: govwatch:slo_lag_error_ratio:1h
        expr: 1 - avg_over_time(govwatch:sli_lag_good[1h])
      - record: govwatch:slo_lag_error_ratio:6h
        expr: 1 - avg_over_time(govwatch:sli_lag_good[6h])
      - record: govwatch:slo_lag_error_ratio:30d
        expr: 1 - avg_over_time(govwatch:sli_lag_good[30d])
      # 1 = untouched budget, 0 = spent, negative = SLO breached
      - record: govwatch:slo_lag_budget_remaining:30d
        expr: 1 - govwatch:slo_lag_error_ratio:30d / 0.01

  - name: govwatch.alerts
    rules:
      - alert: GovwatchWorkerDown
        expr: up{job="govwatch"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: govwatch worker is not being scraped
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchworkerdown

      - alert: GovwatchWorkerStalled
        # job-scoped: only the worker exports this gauge, but say so explicitly
        expr: time() - govwatch_worker_heartbeat_timestamp_seconds{job="govwatch"} > 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: govwatch worker loop hasn't completed a cycle in over an hour
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchworkerstalled

      # multi-window burn rate alerts (google SRE workbook, chapter 5)
      - alert: GovwatchLagBudgetBurnFast
        expr: |
          govwatch:slo_lag_error_ratio:1h > (14.4 * 0.01)
            and
          govwatch:slo_lag_error_ratio:5m > (14.4 * 0.01)
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.source }} ingest lag is burning the 30d error budget at 14x+"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchlagbudgetburn

      - alert: GovwatchLagBudgetBurnSlow
        expr: |
          govwatch:slo_lag_error_ratio:6h > (6 * 0.01)
            and
          govwatch:slo_lag_error_ratio:30m > (6 * 0.01)
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.source }} ingest lag is burning the 30d error budget at 6x+"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchlagbudgetburn

      - alert: GovwatchIngestFailing
        expr: increase(govwatch_ingest_runs_total{status="failed"}[1h]) > 2
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.source }} had 3+ failed ingest runs in the last hour"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchingestfailing

      # agencies publish on weekdays during US business hours (14:00-23:00 UTC is roughly
      # 9/10am-6/7pm Eastern depending on DST). quiet weekends shouldn't page anyone
      - alert: GovwatchRegulationsDataStale
        expr: |
          govwatch:data_staleness_seconds{source="regulations"} > 4 * 3600
            and on () (day_of_week() >= 1 and day_of_week() <= 5)
            and on () (hour() >= 14 and hour() < 23)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: no new regulations.gov documents in 4h during business hours
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchdatastale

      # congress.gov timestamps are whole days and nothing moves on weekends,
      # so the threshold has to clear a long weekend. long recesses will trip it, which
      # is a reasonable thing to look at anyway
      - alert: GovwatchCongressDataStale
        expr: govwatch:data_staleness_seconds{source="congress"} > 4 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: no congress.gov bill updates in over 4 days
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchdatastale

      - alert: GovwatchUpstreamErrors
        expr: govwatch:api_error_ratio:1h > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "over 20% of {{ $labels.source }} API requests are failing"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchupstreamerrors

      - alert: GovwatchRateLimitLow
        expr: govwatch:ratelimit_remaining_ratio < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.source }} has under 10% of its api.data.gov rate limit left"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchratelimitlow

      # the auditor reconciles the source's own record count for the last few full
      # days against what's stored. a shortfall means records were silently dropped
      - alert: GovwatchDataIncomplete
        expr: govwatch_completeness_ratio < 0.99
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.source }} is missing {{ with printf `govwatch_completeness_missing_records{source='%s'}` $labels.source | query }}{{ . | first | value }}{{ end }} records from its last audit window"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchdataincomplete

      # auto-repair fixes the data, but a gap that keeps coming back is a bug in the
      # ingest path. surface it instead of letting the repair hide it
      - alert: GovwatchRepeatedRepairs
        expr: increase(govwatch_completeness_repairs_total[24h]) >= 2
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.source }} needed {{ $value | printf `%.0f` }} auto-repairs in the last 24h"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchrepeatedrepairs

      - alert: GovwatchCompletenessAuditStale
        expr: time() - govwatch_completeness_last_audit_timestamp_seconds > 24 * 3600
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.source }} hasn't had a successful completeness audit in 24h"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchdataincomplete

      - alert: GovwatchMalformedRecords
        expr: increase(govwatch_ingest_malformed_records_total[1h]) > 0
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.source }} returned records that couldn't be parsed"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchmalformedrecords

  # --- phase 2: the summarization agent and the human review step ---------------------
  #
  # Quality signals come from the database (agent/quality.py) as a "recent" (last 7 days)
  # and a "baseline" (the 30 days before) window. Drift alerts compare the two and need at
  # least 30 summaries in each, so a quiet week can't trip them on a handful of bills.
  # Thresholds are set from the first live batches (decisions.md #50) and are meant to be
  # re-tuned once there's a month of history.

  - name: govwatch.agent.recording
    interval: 30s
    rules:
      - record: govwatch:llm_request_duration_seconds:p95_1h
        expr: histogram_quantile(0.95, sum by (le, model) (rate(govwatch_llm_request_duration_seconds_bucket[1h])))

      - record: govwatch:agent_step_duration_seconds:p95_1h
        expr: histogram_quantile(0.95, sum by (le, step) (rate(govwatch_agent_step_duration_seconds_bucket[1h])))

      - record: govwatch:review_queue_oldest_age_seconds
        expr: time() - govwatch_review_queue_oldest_timestamp_seconds

  - name: govwatch.agent.alerts
    rules:
      - alert: GovwatchLLMDown
        expr: govwatch_llm_up == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "the agent can't use {{ $labels.model }}: ollama is down or the model isn't pulled"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchllmdown

      # ~1-3s per call when the model fits in VRAM. 15s+ means it spilled onto the CPU
      # (memory pressure, a bigger model) - the queue will start falling behind
      - alert: GovwatchLLMSlow
        expr: govwatch:llm_request_duration_seconds:p95_1h > 15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.model }} p95 latency is {{ $value | printf `%.0f` }}s"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchllmslow

      - alert: GovwatchAgentFailing
        expr: increase(govwatch_agent_bills_total{outcome="failed"}[1h]) > 5
        labels:
          severity: warning
        annotations:
          summary: more than 5 bills failed to summarize in the last hour
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchagentfailing

      # the shadow check (decisions.md #41): the model's policy area vs the official one.
      # baseline agreement from the first live batches was ~58%
      - alert: GovwatchAgentAgreementDrop
        expr: |
          govwatch_agent_policy_area_agreement{window="recent"}
            < ignoring(window) govwatch_agent_policy_area_agreement{window="baseline"} - 0.15
          and ignoring(window) govwatch_agent_quality_samples{window="recent"} >= 30
          and ignoring(window) govwatch_agent_quality_samples{window="baseline"} >= 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: agreement with official policy areas dropped 15+ points below baseline
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchagentagreementdrop

      # first live batches: ~1-2% of summaries still failed after the retry
      - alert: GovwatchAgentGateFailuresHigh
        expr: |
          govwatch_agent_gate_failure_ratio{window="recent"} > 0.15
          and ignoring(window) govwatch_agent_quality_samples{window="recent"} >= 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of recent summaries failed the validation gate"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchagentgatefailureshigh

      # the model's picks moved but the incoming bills didn't: the model or prompt changed,
      # not the news. if input drift is high too, the bills changed topic and that's fine
      - alert: GovwatchAgentOutputDrift
        expr: |
          govwatch_agent_policy_area_drift{kind="output"} > 0.25
          and ignoring(kind) govwatch_agent_policy_area_drift{kind="input"} < 0.1
          and on() govwatch_agent_quality_samples{window="recent"} >= 30
          and on() govwatch_agent_quality_samples{window="baseline"} >= 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: the model's policy-area picks drifted while the incoming bills didn't
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchagentoutputdrift

      - alert: GovwatchReviewRejectionsHigh
        expr: |
          govwatch_review_rejection_ratio{window="recent"} > 0.3
          and ignoring(window) govwatch_review_decided{window="recent"} >= 10
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "reviewers rejected {{ $value | humanizePercentage }} of recent summaries"
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchreviewrejectionshigh

      - alert: GovwatchReviewQueueStale
        expr: govwatch:review_queue_oldest_age_seconds{status="pending_review"} > 3 * 86400
        for: 1h
        labels:
          severity: info
        annotations:
          summary: a summary has been waiting for review for over 3 days
          runbook_url: https://github.com/viditpawar/govwatch/blob/main/docs/runbook.md#govwatchreviewqueuestale
