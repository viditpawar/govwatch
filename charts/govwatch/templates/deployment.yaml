apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "govwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "govwatch.labels" . | nindent 4 }}
  annotations:
    # deliberate exceptions to the checkov baseline, with the reasoning next to them
    checkov.io/skip1: CKV_K8S_11=No CPU limit on purpose. A CPU request plus a memory limit avoids CFS throttling on a bursty IO-bound worker
    checkov.io/skip2: CKV_K8S_15=pullPolicy is a value. Images side-loaded into kind are in no registry, so Always would break them
    checkov.io/skip3: CKV_K8S_43=Set image.digest to deploy by digest (CI does). Local kind builds use a content-hash tag instead
spec:
  # one active ingester. advisory locks make a second replica safe, but it would
  # only sit there waiting for the lock
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "govwatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "govwatch.selectorLabels" . | nindent 8 }}
      {{- if not .Values.apiKeys.existingSecret }}
      annotations:
        checksum/api-keys: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "govwatch.serviceAccountName" . }}
      # the worker never talks to the kubernetes api
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # migrations run before the worker starts. the runner holds a postgres advisory
      # lock, so overlapping pods during a rollout can't migrate at the same time
      initContainers:
        - name: migrate
          image: {{ include "govwatch.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "govwatch.env" . | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/govwatch
              readOnly: true
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
      containers:
        - name: worker
          image: {{ include "govwatch.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          env:
            {{- include "govwatch.env" . | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          # /healthz only fails when the loop itself is wedged, not when an upstream
          # api is down - restarting wouldn't fix that
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /var/run/secrets/govwatch
              readOnly: true
      # matches the worker's own shutdown: finish the current run, then exit
      terminationGracePeriodSeconds: 60
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- include "govwatch.secretsVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
