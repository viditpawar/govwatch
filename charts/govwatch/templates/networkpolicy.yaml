{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "govwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "govwatch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "govwatch.workerSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # only prometheus, and only the metrics port
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metricsNamespace }}
      ports:
        - port: metrics
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # postgres. scoped to the cnpg cluster's pods when we manage it, any host otherwise
    - ports:
        - { port: 5432, protocol: TCP }
      {{- if .Values.database.cnpg.enabled }}
      to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "govwatch.dbClusterName" . }}
      {{- end }}
    # congress.gov and regulations.gov
    - ports:
        - { port: 443, protocol: TCP }
    {{- if .Values.agent.enabled }}
    # ollama for the agent. it runs where the gpu is (on kind, the host machine via
    # host.docker.internal), so it's outside the cluster and can't be a pod selector
    - ports:
        - { port: {{ .Values.agent.ollamaPort }}, protocol: TCP }
    {{- end }}
{{- end }}
