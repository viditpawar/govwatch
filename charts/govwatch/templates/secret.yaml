{{- if not .Values.apiKeys.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "govwatch.apiKeysSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "govwatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  congress-api-key: {{ required "apiKeys.congress is required (or set apiKeys.existingSecret)" .Values.apiKeys.congress | quote }}
  regulations-api-key: {{ required "apiKeys.regulations is required (or set apiKeys.existingSecret)" .Values.apiKeys.regulations | quote }}
{{- end }}
