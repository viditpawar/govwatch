<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Review queue{% endblock %} · govwatch</title>
  <style>
    :root {
      --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #deded8; --card: #fff;
      --ok: #1f7a4d; --warn: #9a6200; --bad: #b42318; --accent: #2457c5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --fg: #ececea; --muted: #9a9a94; --line: #34342f; --card: #1f1f1d;
        --ok: #4cc38a; --warn: #f0b44c; --bad: #ff7a6b; --accent: #7aa2ff;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { border-bottom: 1px solid var(--line); background: var(--card); }
    header .wrap { display: flex; gap: 24px; align-items: baseline; }
    header a.brand { font-weight: 650; color: var(--fg); text-decoration: none; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 14px 20px; }
    a { color: var(--accent); }
    h1 { font-size: 20px; margin: 8px 0 16px; }
    h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .muted { color: var(--muted); }
    .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
    .pending_review { color: var(--accent); }
    .needs_attention, .mismatch { color: var(--warn); }
    .approved, .match { color: var(--ok); }
    .rejected, .error { color: var(--bad); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .tabs a { margin-right: 14px; text-decoration: none; }
    .tabs a.on { font-weight: 650; text-decoration: underline; }
    .source { white-space: pre-wrap; max-height: 420px; overflow: auto; font-size: 14px; }
    .summary { font-size: 17px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    form .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    input[type=text], textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
    textarea { width: 100%; min-height: 70px; }
    button { font: inherit; padding: 7px 16px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; background: var(--card); color: var(--fg); }
    button.approve { border-color: var(--ok); color: var(--ok); }
    button.reject { border-color: var(--bad); color: var(--bad); }
    .flash { border-color: var(--bad); color: var(--bad); }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="brand" href="/">govwatch review</a>
    <span class="muted">Agent summaries wait here until a person approves them.</span>
  </div></header>
  <main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
