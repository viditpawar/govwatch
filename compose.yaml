name: govwatch

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: govwatch
      POSTGRES_PASSWORD: govwatch
      POSTGRES_DB: govwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/compose/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govwatch -d govwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
