# weekly, grouped, so it's one PR per ecosystem instead of a drip of them.
# github-actions updates bump the pinned SHAs and their version comments together
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # patch releases (3.12.x security fixes) come through automatically. a minor bump like
    # 3.12 -> 3.14 also changes .python-version, uv.lock and what CI tests against, so it
    # gets done as one deliberate change instead of a base image PR
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
